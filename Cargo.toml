[package]
name = "widgets"
version = "0.1.0"
edition = "2024"
description = "macOS/iOS-style liquid glass desktop widgets for Windows (unsupported personal project)"
license = "MIT"
publish = false

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Registry", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Devices_Radios", "Devices_Bluetooth", "Devices_Enumeration", "Networking", "Networking_Connectivity", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Com_StructuredStorage", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Power"] }
